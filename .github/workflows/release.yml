name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty for automatic release-<date>)'
        required: false
        default: ''
      is_draft:
        description: 'Create as draft release'
        type: boolean
        default: false
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libprotobuf-dev protobuf-compiler libmbedtls-dev libwebsockets-dev

      - name: Build and Package Linux
        run: |
          chmod +x build.sh run_cs2_gc.sh cleanup_cs2_folder.sh
          ./build.sh --package

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*-linux-x64.*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\vcpkg\archives
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'overlays/**') }}
          restore-keys: vcpkg-archives-${{ runner.os }}-

      - name: Build Windows
        shell: cmd
        run: |
          if defined VCPKG_INSTALLATION_ROOT set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          build.cmd

      - name: Package Windows Release
        shell: cmd
        run: python tools\make_release_zip.py --exe release\cs2_gc.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-linux, build-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="release-$(date +'%Y-%m-%d-%H%M')"
            fi
          fi

          DRAFT_FLAG=""
          if [ "${{ github.event.inputs.is_draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          echo "Publishing release with tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            gh release create "$TAG" release_assets/* \
              --title "Release $TAG" \
              --generate-notes \
              $DRAFT_FLAG
          fi
