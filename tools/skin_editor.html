<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skin editor</title>
<script src="/text.js"></script>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel2: #23272f; --line: #2b2f37; --text: #e6e8eb; --muted: #8b919c;
    --accent: #f0a32a; --accent-dim: rgba(240, 163, 42, 0.16); --danger: #e5534b; --ok: #4cc38a; --field: #121418;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--bg); color: var(--text);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none;
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    background: #2a2e36; border: 1px solid #3a3f49; border-radius: 6px; padding: 5px 10px; cursor: pointer;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { background: #333842; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); color: #1b1407; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: var(--danger); }
  button.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  button svg { width: 18px; height: 18px; flex: none; }
  select, input[type=text], input[type=number] {
    background: var(--field); border: 1px solid #3a3f49; border-radius: 6px; padding: 4px 8px; min-width: 0;
  }
  input[type=text], input[type=number] { user-select: text; }
  input[type=color] { width: 34px; height: 28px; padding: 0 2px; border: 1px solid #3a3f49; border-radius: 6px; background: var(--field); cursor: pointer; }
  input[type=range] { accent-color: var(--accent); width: 100%; min-width: 0; }
  label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  header.top {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-right: 6px; }
  .brand .logo { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), #e5534b); }
  .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .field select { color: var(--text); }
  #weapon { max-width: 230px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }

  main#work { display: grid; grid-template-columns: 50px minmax(0, 1fr) 300px; min-height: 0; }
  nav.tools { display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; background: var(--panel); border-right: 1px solid var(--line); }
  nav.tools button { width: 38px; height: 38px; padding: 0; justify-content: center; }
  nav.tools .sep { height: 1px; background: var(--line); margin: 6px 2px; }

  section.views { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-width: 0; min-height: 0; background: #101216; }
  section.views.only-2d { grid-template-columns: 1fr; }
  section.views.only-3d { grid-template-columns: 1fr; }
  section.views.only-2d #pane3d, section.views.only-3d #pane2d { display: none; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #pane3d::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--line); z-index: 2; }
  section.views.only-3d #pane3d::before { display: none; }
  .pane-head {
    position: relative; z-index: 2; height: 38px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: var(--panel); border-bottom: 1px solid var(--line); overflow: hidden;
  }
  .pane-head .title { font-weight: 600; margin-right: 4px; }
  .pane-head button { padding: 3px 8px; }
  .pane-head .zoom { color: var(--muted); min-width: 44px; text-align: right; }
  .pane-body { position: relative; flex: 1; min-height: 0; touch-action: none; overflow: hidden; }
  .views.tool-brush .pane-body, .views.tool-eraser .pane-body { cursor: none; }
  .views.tool-fill .pane-body, .views.tool-picker .pane-body { cursor: crosshair; }
  .views.tool-move #view2d { cursor: move; }
  .views.tool-move #view3d { cursor: grab; }
  .views.panning .pane-body { cursor: grabbing !important; }
  .cursor {
    position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; border-radius: 50%; display: none;
    border: 1px solid rgba(255, 255, 255, 0.95); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  }
  .loading {
    position: absolute; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; gap: 10px;
    background: rgba(16, 18, 22, 0.72); font-size: 14px;
  }
  .loading.show { display: flex; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #3a3f49; border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); z-index: 2; pointer-events: none; }

  .decal { position: absolute; left: 0; top: 0; z-index: 4; outline: 1px dashed rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); cursor: move; transform-origin: 50% 50%; }
  .decal img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .decal .h-scale, .decal .h-rot {
    position: absolute; width: 14px; height: 14px; background: var(--accent); border: 2px solid #1b1407; border-radius: 3px;
  }
  .decal .h-scale { right: -8px; bottom: -8px; cursor: nwse-resize; }
  .decal .h-rot { left: calc(50% - 7px); top: -30px; border-radius: 50%; cursor: alias; }
  .decal .h-rot::after { content: ""; position: absolute; left: 4px; top: 12px; width: 2px; height: 16px; background: var(--accent); }
  .decal-bar {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: rgba(28, 31, 37, 0.95); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  .decal-bar .hint { color: var(--muted); flex: 1 1 260px; }
  .decal-bar label:not(.check) { display: inline-flex; align-items: center; gap: 6px; width: 170px; }

  aside.side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .panel { padding: 12px; border-bottom: 1px solid var(--line); }
  .panel h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  .color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .color-row #color { width: 44px; height: 32px; }
  .hex { width: 84px; font-family: Consolas, monospace; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; min-height: 18px; }
  .swatches button { width: 18px; height: 18px; padding: 0; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.15); }
  .slider { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; margin: 6px 0; color: var(--muted); }
  .slider output { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .layer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .layer-actions button { justify-content: center; }
  .layer-tools { display: flex; gap: 4px; margin-bottom: 8px; }
  .layer-tools button { flex: 1; justify-content: center; padding: 4px; }
  .layers { display: flex; flex-direction: column; gap: 3px; }
  .layer {
    display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid transparent; border-radius: 6px;
    background: var(--panel2); cursor: pointer; min-height: 32px;
  }
  .layer.active { border-color: var(--accent); background: #2b2a24; }
  .layer .eye { padding: 2px; border: 0; background: none; color: var(--muted); }
  .layer .eye.off { opacity: 0.35; }
  .layer .kind { width: 18px; text-align: center; color: var(--muted); font-size: 11px; }
  .layer .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .name input { width: 100%; }
  .layer .op { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .layer.base-row { cursor: default; margin-top: 3px; background: #1f2229; }
  .layer.base-row select { padding: 2px 4px; max-width: 120px; }
  .layer.base-row input[type=color] { width: 28px; height: 24px; }
  #props { margin-top: 10px; }
  .metal-row { margin: 4px 0 2px; }
  .layer .kind.metal { color: var(--accent); }
  .finish-hint { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
  .finish-colors { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 6px; }
  .finish-colors label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
  .finish-colors input[type=color] { width: 30px; height: 24px; flex: none; }
  .help ul { margin: 0; padding-left: 16px; color: var(--muted); }
  .help li { margin: 3px 0; }
  .help b { color: var(--text); font-weight: 600; }

  footer.status {
    display: flex; gap: 16px; padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted);
    font-size: 12px; white-space: nowrap; overflow: hidden;
  }
  footer.status #status { flex: 1; overflow: hidden; text-overflow: ellipsis; }

  .modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); }
  .modal.show { display: flex; }
  .dialog {
    width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); user-select: text;
  }
  .dialog h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .form { display: grid; grid-template-columns: 150px 1fr; gap: 10px 12px; align-items: center; }
  .form > span { color: var(--muted); }
  .form .pair { display: flex; gap: 8px; align-items: center; }
  .form .pair input[type=number] { width: 90px; }
  .form .sub { grid-column: 2; color: var(--muted); font-size: 12px; margin-top: -6px; }
  .note { color: var(--muted); margin: 12px 0 0; }
  .note.warn { color: var(--accent); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .result { margin-top: 14px; display: none; }
  .result.show { display: block; }
  .result img { width: 100%; border-radius: 8px; background: #282828; display: block; }
  .result pre { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; color: var(--muted); background: var(--field); border-radius: 8px; padding: 10px; margin: 10px 0 0; max-height: 160px; overflow: auto; }
  .result .ok { color: var(--ok); margin-top: 10px; }
  .skins { display: flex; flex-direction: column; gap: 8px; }
  .skin { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; background: var(--panel2); border-radius: 8px; padding: 8px; }
  .skin img { width: 150px; height: 84px; object-fit: cover; object-position: left center; border-radius: 6px; background: #282828; }
  .skin .meta { min-width: 0; }
  .skin .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skin .meta span { color: var(--muted); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .skin .btns { display: flex; flex-direction: column; gap: 6px; }
  .checker { background: repeating-conic-gradient(#2c3038 0 25%, #22252b 0 50%) 0 0 / 16px 16px; }
  .sticker-new { display: grid; grid-template-columns: 180px 1fr; gap: 16px; align-items: start; }
  .sticker-pic { width: 180px; height: 180px; padding: 0; position: relative; border-radius: 10px; overflow: hidden; display: block; }
  .sticker-pic canvas { width: 100%; height: 100%; display: block; }
  .sticker-pic span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; color: var(--muted); font-size: 12px; }
  .sticker-pic.has span { display: none; }
  .sticker-new .form { grid-template-columns: 110px 1fr; }
  .sticker-mask { width: 64px; height: 64px; padding: 0; flex: none; border-radius: 6px; overflow: hidden; display: block; }
  .sticker-mask canvas { width: 100%; height: 100%; display: block; }
  #st-mask-text { flex: 1; }
  .st-mask-row.off { display: none; }
  .skin.st { grid-template-columns: 84px 1fr auto; }
  .skin.st img { width: 84px; height: 84px; object-fit: contain; }

  #toasts { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast { background: #2a2e36; border: 1px solid #3a3f49; border-radius: 8px; padding: 8px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); max-width: 520px; }
  .toast.error { border-color: var(--danger); }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"></span><b data-t="title"></b></div>
  <label class="field"><span data-t="weapon"></span><select id="weapon"></select></label>
  <label class="field"><span data-t="size"></span><select id="size">
    <option value="1024">1024</option><option value="2048" selected>2048</option><option value="4096">4096</option>
  </select></label>
  <label class="field"><span data-t="finish"></span><select id="finish">
    <option value="custom" data-t="finishCustom"></option><option value="gunsmith" data-t="finishGunsmith"></option><option value="patina" data-t="finishPatina"></option>
  </select></label>
  <div class="spacer"></div>
  <div class="seg" id="layout">
    <button data-v="2d">2D</button><button data-v="both" data-t="both"></button><button data-v="3d">3D</button>
  </div>
  <button id="open-png" data-t="openPng"></button>
  <button id="stickers-btn" data-t="stickers"></button>
  <button id="my-skins" data-t="mySkins"></button>
  <button id="export-png" data-t="exportPng"></button>
  <button id="build" class="primary" data-t="buildSkin"></button>
</header>

<main id="work">
  <nav class="tools" id="tools">
    <button data-tool="brush" data-tt="toolBrush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.4 3.6a2 2 0 0 1 2.8 2.8L11 16.6 7.4 13z"/><path d="M7 13.4c-2.2 0-3.6 1.5-3.6 3.4 0 1.4-.6 2.4-1.4 3.2 3.6.6 7.6-.4 8.4-3.2"/></svg></button>
    <button data-tool="eraser" data-tt="toolEraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20l-3.6-3.6a2 2 0 0 1 0-2.8L13.6 3.4a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8L11 20z"/><path d="M8.5 9.5l6 6M7 20h13"/></svg></button>
    <button data-tool="fill" data-tt="toolFill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L11.5 4l8 8-7.5 7.5a2 2 0 0 1-2.8 0L4 14.3a2 2 0 0 1 0-2.8z"/><path d="M4.5 12.5h15"/><path d="M21 16.5s1.5 2 1.5 3a1.5 1.5 0 0 1-3 0c0-1 1.5-3 1.5-3z"/></svg></button>
    <button data-tool="picker" data-tt="toolPicker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5l4.5 4.5M13.5 6l4.5 4.5-9 9H4.5V15z"/><path d="M14.6 3.4a2 2 0 0 1 2.8 0l3.2 3.2a2 2 0 0 1 0 2.8"/></svg></button>
    <button data-tool="move" data-tt="toolMove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    <div class="sep"></div>
    <button id="undo" data-tt="undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" data-tt="redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </nav>

  <section class="views tool-brush" id="views">
    <canvas id="gl"></canvas>
    <div class="pane" id="pane2d">
      <div class="pane-head">
        <span class="title" data-t="paneUv"></span>
        <button id="opt-seams" data-t="seams" data-tt="seamsTip"></button>
        <button id="opt-dim" data-t="dim" data-tt="dimTip"></button>
        <div class="spacer"></div>
        <span class="zoom" id="zoom2d"></span>
        <button id="fit2d" data-t="fit"></button>
      </div>
      <div class="pane-body" id="view2d"><div class="cursor" id="cursor2d"></div></div>
    </div>
    <div class="pane" id="pane3d">
      <div class="pane-head">
        <span class="title" data-t="paneModel"></span>
        <button data-cam="side" data-t="viewSide"></button>
        <button data-cam="other" data-t="viewOther"></button>
        <button data-cam="top" data-t="viewTop"></button>
        <div class="spacer"></div>
        <button id="opt-light" data-t="lightGame" data-tt="lightGameTip"></button>
        <button id="decal-btn" data-t="decal" data-tt="decalTip"></button>
      </div>
      <div class="pane-body" id="view3d">
        <div class="cursor" id="cursor3d"></div>
        <div class="decal" id="decal" hidden><img id="decal-img" alt="" draggable="false"><div class="h-scale"></div><div class="h-rot"></div></div>
        <div class="decal-bar" id="decal-bar" hidden>
          <span class="hint" data-t="decalHint"></span>
          <label><span data-t="opacity"></span><input type="range" id="d-op" min="5" max="100" value="100"></label>
          <label class="check"><input type="checkbox" id="d-flip"><span data-t="decalFlip"></span></label>
          <label class="check" data-tt="decalEdgesTip"><input type="checkbox" id="d-edges" checked><span data-t="decalEdges"></span></label>
          <button id="d-cancel" data-t="cancel"></button>
          <button id="d-apply" class="primary" data-t="decalApply"></button>
        </div>
      </div>
    </div>
    <div class="loading" id="loading"><div class="spinner"></div><span id="loading-text"></span></div>
  </section>

  <aside class="side">
    <section class="panel">
      <h3 data-t="brushTitle"></h3>
      <div class="color-row">
        <input type="color" id="color">
        <input type="text" id="hex" class="hex" maxlength="7" spellcheck="false">
      </div>
      <div class="swatches" id="recent"></div>
      <label class="slider"><span data-t="brushSize"></span><input type="range" id="b-size" min="2" max="400"><output id="o-size"></output></label>
      <label class="slider"><span data-t="brushHardness"></span><input type="range" id="b-hard" min="0" max="100"><output id="o-hard"></output></label>
      <label class="slider"><span data-t="brushOpacity"></span><input type="range" id="b-op" min="1" max="100"><output id="o-op"></output></label>
    </section>
    <section class="panel">
      <h3 data-t="finishTitle"></h3>
      <p class="finish-hint" id="finish-hint"></p>
      <div class="finish-colors" id="finish-colors">
        <label><input type="color" data-ci="0"><span data-t="colorBaseMetal"></span></label>
        <label><input type="color" data-ci="1"><span data-t="colorPatinaTint"></span></label>
        <label><input type="color" data-ci="2"><span data-t="colorPatinaWear"></span></label>
        <label><input type="color" data-ci="3"><span data-t="colorGrime"></span></label>
      </div>
      <label class="slider"><span data-t="roughness"></span><input type="range" id="fin-rough" min="0" max="100"><output id="o-rough"></output></label>
      <label class="slider" data-tt="pearlescenceTip"><span data-t="pearlescence"></span><input type="range" id="fin-pearl" min="-600" max="600"><output id="o-pearl"></output></label>
    </section>
    <section class="panel">
      <h3 data-t="layersTitle"></h3>
      <div class="layer-actions">
        <button id="add-layer" data-t="addLayer"></button>
        <button id="add-image" data-t="addImage"></button>
      </div>
      <div class="layer-tools">
        <button id="layer-up" data-tt="layerUp">&#9650;</button>
        <button id="layer-down" data-tt="layerDown">&#9660;</button>
        <button id="layer-dup" data-t="dupLayer"></button>
        <button id="layer-del" class="danger" data-t="deleteLayer"></button>
      </div>
      <div class="layers" id="layers"></div>
      <div class="layer base-row">
        <span class="kind">&#9638;</span><span class="name" data-t="base"></span>

async function openSkin(s) {
  closeModal('skins-modal');
  if (s.weapon !== app.weapon) await selectWeapon(s.weapon);
  if (s.weapon !== app.weapon) return;
  try {
    const img = await loadImage(`/api/skin/${encodeURIComponent(s.kit)}/texture?t=${Date.now()}`);
    app.fin[s.finish] = { colors: s.colors ? [...s.colors] : null, roughness: s.roughness, pearl: s.pearlescence };
    setFinish(s.finish);
    if (s.paintMask) {
      // gunsmith: the bare metal goes to its own layer marked as metal
      const mask = imagePixels(await loadImage(`/api/skin/${encodeURIComponent(s.kit)}/paint?t=${Date.now()}`), app.S, app.S).slice();
      const px = imagePixels(img, app.S, app.S).slice();
      const P = newLayer('paint', s.name), M = newLayer('paint', t('metalLayer', s.name));
      M.metal = true;
      for (let i = 0; i < px.length; i += 4) {
        const dst = mask[i] >= 128 ? P.data : M.data;
        dst[i] = px[i]; dst[i + 1] = px[i + 1]; dst[i + 2] = px[i + 2]; dst[i + 3] = 255;
      }
      insertLayer(M, aboveActive());
      insertLayer(P, aboveActive());
    } else {
      addPaintLayerFromImage(img, s.name);
    }
    Object.assign(app.form, { name: s.name, description: s.description, prefix: s.prefix, prefixEdited: true, rarity: s.rarity, durability: s.durability, wear: s.wear });
    toast(t('opened', s.name));
  } catch (err) { toast(err.message, true); }
}

// the picture and the effect mask fitted into 1024x1024 (the same way, so a mask of the picture's size lines
// up), the sticker being edited
const sticker = { picture: null, mask: null, kit: null, pickMask: false };
function fitSquare(img) {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const k = Math.min(1024 / img.naturalWidth, 1024 / img.naturalHeight);
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, (1024 - w) / 2, (1024 - h) / 2, w, h);
  return c;
}
function drawInto(canvas, source) {
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, canvas.width, canvas.height);
  if (source) g.drawImage(source, 0, 0, canvas.width, canvas.height);
}
function setStickerPicture(img) {
  sticker.picture = fitSquare(img);
  drawInto($('#st-canvas'), sticker.picture);
  $('#st-pic').classList.add('has');
}
function setStickerMask(img) {
  sticker.mask = img ? fitSquare(img) : null;
  drawInto($('#st-mask-canvas'), sticker.mask);
  updateStickerFinish();
}
async function maskFile(f) {
  try { setStickerMask(await loadImage(URL.createObjectURL(f))); } catch (err) { toast(err.message, true); }
}
function updateStickerFinish() {
  const finish = $('#st-finish').value, masked = finish === 'holo' || finish === 'glitter';
  $$('.st-mask-row').forEach(e => e.classList.toggle('off', !masked));
  $('#st-mask-text').textContent = sticker.mask ? t('stickerMaskOwn') : t('stickerMaskPick');
  $('#st-mask-clear').disabled = !sticker.mask;
}
async function stickerFile(f) {
  try {
    setStickerPicture(await loadImage(URL.createObjectURL(f)));
    if (!$('#st-name').value.trim() && f.name && f.name !== 'image.png') $('#st-name').value = f.name.replace(/\.[^.]+$/, '');
  } catch (err) { toast(err.message, true); }
}
function updateStickerNote() {
  $('#st-note').textContent = (sticker.kit ? t('stickerRebuild', sticker.kit) + ' ' : '') + t('stickerNote')
    + (app.info.cs2Running ? ' ' + t('stickerRunning') : '');

function newSticker() {

function stickerKit(name) {
  // a new sticker gets a name of its own; the one being edited keeps its
  if (sticker.kit) return sticker.kit;
  const base = 'cs2gc_' + slug(name).replace(/^skin$/, 'sticker'), taken = new Set((app.stickers || []).map(s => s.kit));
  let kit = base;
  for (let i = 2; taken.has(kit); i++) kit = base + i;
  return kit;
}
async function buildSticker() {

    else if (c === 'KeyF') { fit2d(); fit3d(); }
    else if (c === 'Escape') cancelDecal();
    else if (c === 'Enter' && app.decal) applyDecal();
    else if (c === 'Space') { app.space = true; e.preventDefault(); }
    else return;
    hideCursors();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') app.space = false; });
  window.addEventListener('beforeunload', e => { if (app.changed) { e.preventDefault(); e.returnValue = ''; } });
  new ResizeObserver(() => { resize(); if (app.geo && !app.v2.fitted) fit2d(); }).observe($('#views'));
}
function setFinish(f) {
  if (!FINISH_INDEX.hasOwnProperty(f)) f = 'custom';
  app.finish = f;
  $('#finish').value = f;
  store.set('finish', f);
  syncFinishUI();
  markAll();
  renderLayers();
  app.needRender = true;
}
function syncFinishUI() {
  const p = finishParams();
  $('#finish-hint').textContent = t('finishHint_' + app.finish);
  $('#finish-colors').style.display = p.colors ? '' : 'none';
  if (p.colors) $$('#finish-colors input').forEach(el => { el.value = '#' + p.colors[+el.dataset.ci]; });
  $('#fin-rough').value = Math.round(p.roughness * 100);
  $('#o-rough').textContent = p.roughness.toFixed(2);
  $('#fin-pearl').value = Math.round(p.pearl * 100);
  $('#o-pearl').textContent = p.pearl.toFixed(1);
}
function syncOpts() {
  $('#opt-seams').classList.toggle('on', app.opts.seams);
  $('#opt-dim').classList.toggle('on', app.opts.dim);
  $('#opt-light').classList.toggle('on', app.opts.gameLight);
  store.set('opts', app.opts);
  app.needRender = true;
}

function frame() {
  requestAnimationFrame(frame);
  for (const L of app.layers) if (L.needsRaster) rasterImage(L);
  if (app.dirty) flushComposite();
  if (app.needRender) { app.needRender = false; draw(); }
}

async function init() {
  applyTexts();
  if (!gl) { $('#views').innerHTML = `<div class="empty-hint">${t('noWebgl')}</div>`; return; }
  initGL();
  bind();
  const brush = store.get('brush', {});
  app.size = brush.size || 40; app.hardness = brush.hardness ?? 0.75; app.opacity = brush.opacity ?? 1;
  app.recent = store.get('recent', []);
  app.opts = { ...app.opts, ...store.get('opts', {}) };
  app.S = [1024, 2048, 4096].includes(store.get('size', 2048)) ? store.get('size', 2048) : 2048;
  $('#size').value = app.S;
  $('#base-color').value = app.baseColor;
  setColor(app.color);
  renderRecent();
  syncBrushUI();
  syncOpts();
  setTool('brush');
  setLayout(store.get('layout', 'both'));
  allocate();
  resize();
  requestAnimationFrame(frame);
  setLoading(t('loading'));
  try {
    app.info = await fetchJSON('/api/info?lang=' + (T.gameLang || 'english'));
  } catch (err) {
    setLoading(null);
    toast(err.message, true);
    return;
  }
  const sel = $('#weapon');
  const groups = [[t('guns'), x => !x.knife && !x.gear], [t('knives'), x => x.knife], [t('gear'), x => x.gear]];
  for (const [label, pick] of groups) {
    const og = document.createElement('optgroup');
    og.label = label;
    for (const w of app.info.weapons.filter(pick)) og.appendChild(new Option(w.title, w.short));
    if (og.children.length) sel.appendChild(og);
  }
  const rs = $('#f-rarity');
  for (const r of app.info.rarities) rs.appendChild(new Option((T.rarities || {})[r] || r, r));
  for (const [name, f] of Object.entries(app.info.finishes || {})) {
    app.fin[name] = { colors: f.colors ? [...f.colors] : null, roughness: f.roughness, pearl: 0 };
  }
  setFinish(store.get('finish', 'custom'));
  await selectWeapon(store.get('weapon', 'ak47'));
}
init();
</script>
</body>
